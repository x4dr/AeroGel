modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mixins]]
config = "aerogel.mixins.json"

# Sable physics bodies promote the proxy terrain they reach (#9); skipped by FML when Sable is absent.
[[mixins]]
config = "aerogel.sable.mixins.json"
requiredMods = ["sable"]

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Create / Aeronautics / Sable are OPTIONAL. AeroGel's core (low-poly proxy terrain for fast travel)
# works in any NeoForge pack (elytra, etc.). Create-family integration is loaded only when present.
[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[${create_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "aeronautics"
type = "optional"
versionRange = "[${aeronautics_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "sable"
type = "optional"
versionRange = "[2.0.0,3.0.0)"
ordering = "NONE"
side = "BOTH"
